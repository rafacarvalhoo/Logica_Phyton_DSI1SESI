<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estilo</title>

    <!-- CSS Interno -->
     <!-- Ele fica dentro da tag <style> no <head> do HTML -->
    <style>
        h1 {
            color:brown
        }
    </style>
    <!-- ####################################### -->
    <!-- CSS Externo - O MELHOR DE TODOS!!! -->
    <link rel="stylesheet" href="./css/style.css">
    <!-- ####################################### -->
    
</head>
<body>
    <!-- CSS (Cascading Style Sheets) é o que dá forma, cor, design e estilo ao HTML -->

    <!-- CSS inline -->
     <!-- Definido diretamente na tag HTML, dentro do atributo style="" -->
      <!-- Quando usar?
       Quando você precisa esitilizar um único elemento rapidamente (ex: testar uma cor diferente em um botão)-->
     <h1 style="font-size: 120px;">Título em Vermelho</h1>
     
    <h2>DSI1 SESI</h2>

</body>
</html>
